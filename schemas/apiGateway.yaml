openapi: 3.0.3
info:
  title: Warm House - API Gateway
  version: 2.0.0
  description: "API"

servers:
  - url: https://api.warmhouse.com

paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Auth tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "400":
          description: Bad Request. Invalid email or password format.
  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
        "400":
          description: Bad Request. Invalid email or password format, or user already exists.
  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: "Successfully logged out" }
        "401": { description: "Unauthorized" }
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New access token
        "400":
          description: Bad Request. Invalid refresh token.

  /user:
    get:
      summary: Get current user info
      tags: [User]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: "Unauthorized" }

  /devices:
    get:
      summary: List user's connected devices
      tags: [ConnectDevice]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: A list of user's devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "401": { description: "Unauthorized" }
    post:
      summary: Connect a new device for the user
      tags: [ConnectDevice]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId: { type: string, description: "ID устройства из списка доступных" }
      responses:
        "201":
          description: Device connected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400": { description: "Bad Request. Invalid model ID." }
        "401": { description: "Unauthorized" }

  /devices/{id}:
    delete:
      summary: Disconnect a device for the user
      tags: [ConnectDevice]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: "Device disconnected successfully" }
        "401": { description: "Unauthorized" }
        "404": { description: "Device not found" }
    get:
      summary: Get specific device info
      tags: [ManageDevice]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401": { description: "Unauthorized" }
        "404": { description: "Device not found" }

  /devices/{id}/command:
    post:
      summary: Send command to a device
      tags: [ManageDevice]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command: { type: string }
                params: { type: object }
      responses:
        "202": { description: "Command accepted" }
        "400": { description: "Bad Request. Invalid command or parameters." }
        "401": { description: "Unauthorized" }

  /telemetry/{deviceId}:
    get:
      summary: Get telemetry for a device
      tags: [Telemetry]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: sensorId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Telemetry records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Telemetry"
        "400": { description: "Bad Request. Invalid deviceId or query parameters." }
        "401": { description: "Unauthorized" }

  /admin/device-models:
    get:
      summary: List all available device models
      description: "Admin only. Get a list of all device models supported by the system."
      tags: [NewDevice]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of device models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceModel'
        "401": { description: "Unauthorized" }
        "403": { description: "Forbidden. Admin access required."}
    post:
      summary: Create a new device model
      description: "Admin only. Adds a new type of device to the system."
      tags: [NewDevice]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceModel'
      responses:
        "201":
          description: Device model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceModel'
        "400": { description: "Bad Request. Invalid model data." }
        "401": { description: "Unauthorized" }
        "403": { description: "Forbidden. Admin access required."}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }

    Device:
      type: object
      properties:
        id: { type: string, description: "Уникальный ID экземпляра устройства пользователя" }
        deviceId: { type: string, description: "ID модели, к которой относится это устройство" }
        status: { type: string, enum: [ONLINE, OFFLINE] }

    DeviceModel:
      type: object
      description: "Схема для описания модели устройства (интеграции)"
      properties:
        id: { type: string, description: "Уникальный ID модели, например 'termostat-v3'" }
        name: { type: string, description: "Человекочитаемое имя, например 'Умный Термостат v3'"}
        manufacturer: { type: string, description: "Производитель" }
        model: { type: string, description: "Модель" }
        protocol: { type: string, description: "Протокол" }
        supportedCommands: { type: array, items: { type: string }, description: "Список поддерживаемых команд, например ['set_temp', 'turn_off']" }

    Telemetry:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        name: { type: string }
        type: { type: string }
        location: { type: string }
        value: { type: number }
        unit: { type: string }
        status: { type: string, enum: [OK, ERROR] }
        lastUpdated: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }